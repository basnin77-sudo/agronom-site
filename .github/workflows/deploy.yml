name: Deploy website to Timeweb (SFTP)

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'assets/**'
      - 'downloads/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'favicon.ico'
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose dry-run first; deploy uploads website files"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - deploy

permissions:
  contents: read

concurrency:
  group: timeweb-site-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: timeweb-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
          PASSWORD: ${{ secrets.TIMEWEB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HOST PORT USER PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          if [ ! -f index.html ]; then echo "::error::index.html missing in repository root"; exit 1; fi

      - name: Build upload manifest (no changes)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          excluded_dirs = {'.git','.github','__pycache__','.venv','node_modules'}
          excluded_files = {'README.md','README_RU.txt','README_UPDATE.txt','FILES_SHA256.txt','configure_domain.py','.gitignore'}
          files = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in excluded_dirs for x in p.parts) or p.name in excluded_files or p.name.startswith('.'):
                  continue
              files.append(p.as_posix())
          files.sort()
          if 'index.html' not in files: raise SystemExit('index.html absent from upload manifest')
          Path('/tmp/site-manifest.txt').write_text('\n'.join(files)+'\n')
          print(f'Prepared {len(files)} website files. First 40:')
          print('\n'.join(files[:40]))
          PY

      - name: Upload files (only in deploy mode)
        if: ${{ github.event_name == 'push' || inputs.mode == 'deploy' }}
        env:
          HOST: ${{ secrets.TIMEWEB_HOST }}
          PORT: ${{ secrets.TIMEWEB_PORT }}
          USER: ${{ secrets.TIMEWEB_USER }}
          PASSWORD: ${{ secrets.TIMEWEB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check paramiko==3.5.1
          python3 - <<'PY'
          import os, posixpath
          from pathlib import Path
          import paramiko

          host = os.environ['HOST']
          port = int(os.environ['PORT'])
          user = os.environ['USER']
          password = os.environ['PASSWORD']
          import subprocess
          expected = 'SHA256:NY9WDO5CJ76/nGCdbrpr1bJGL9vTmNOQm7osut6v1uU'
          if host != 'vh276.timeweb.ru' or port != 22:
              raise RuntimeError('Unexpected SFTP host/port; refusing deployment')
          import socket, time
          try:
              addresses = sorted({entry[4][0] for entry in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)})
              print('DNS addresses:', ', '.join(addresses), flush=True)
          except OSError as exc:
              raise RuntimeError(f'DNS resolution failed: {exc}') from exc
          keys = []
          for attempt in range(1, 4):
              try:
                  with socket.create_connection((host, port), timeout=12) as sock:
                      banner = sock.recv(128).decode('ascii', 'replace').strip()
                      print('TCP connection established; SSH banner:', banner, flush=True)
              except OSError as exc:
                  print(f'TCP connection attempt {attempt} failed: {exc}', flush=True)
              scan = subprocess.run(['ssh-keyscan','-T','20','-t','ed25519','-p',str(port),host], capture_output=True, text=True)
              keys = [line for line in scan.stdout.splitlines() if line and not line.startswith('#')]
              if keys: break
              print(f'ssh-keyscan attempt {attempt} failed (exit {scan.returncode}): {scan.stderr[:400]}', flush=True)
              time.sleep(3)
          if len(keys) != 1: raise RuntimeError('No unique ED25519 SSH host key obtained after 3 attempts; deployment stopped before file changes')
          check = subprocess.run(['ssh-keygen','-lf','-'],input=keys[0]+'\n',text=True,capture_output=True,check=True)
          if expected not in check.stdout:
              raise RuntimeError('SSH host fingerprint mismatch; refusing deployment')
          known_hosts = Path('/tmp/timeweb_known_hosts')
          known_hosts.write_text(keys[0] + '\n')
          known_hosts.chmod(0o600)
          ssh = paramiko.SSHClient()
          ssh.load_host_keys(str(known_hosts))
          ssh.set_missing_host_key_policy(paramiko.RejectPolicy())
          ssh.connect(hostname=host, port=port, username=user, password=password,
                      look_for_keys=False, allow_agent=False, timeout=20,
                      auth_timeout=20, banner_timeout=20)
          sftp = ssh.open_sftp()
          remote_root = 'AGRONOM/public_html'
          # The prior read-only SFTP test confirmed this path relative to account home.
          if not sftp.stat(posixpath.join(remote_root,'index.html')):
              raise RuntimeError('Remote index.html missing; refusing deployment')
          paths = Path('/tmp/site-manifest.txt').read_text().splitlines()
          for path in paths:
              remote = posixpath.join(remote_root, path)
              folder = posixpath.dirname(remote)
              current = ''
              for part in folder.split('/'):
                  current = posixpath.join(current,part)
                  try:
                      sftp.stat(current)
                  except IOError:
                      sftp.mkdir(current)
              # Upload to temporary file, then rename. No remote deletions.
              temp = remote + '.github-uploading'
              sftp.put(path,temp)
              sftp.posix_rename(temp,remote)
              print('Uploaded:',path)
          sftp.close()
          ssh.close()
          print(f'Deployed {len(paths)} files to {remote_root}; no remote files deleted')
          PY
