name: Diagnose Timeweb connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check DNS, IPv4 TCP and FTPS negotiation (no credentials)
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import socket, ssl
          host='vh276.timeweb.ru'
          for port in (22,21):
              try:
                  infos=socket.getaddrinfo(host,port,family=socket.AF_INET,type=socket.SOCK_STREAM)
                  ips=sorted({item[4][0] for item in infos})
                  print(f'port {port}: IPv4 DNS={ips}',flush=True)
              except Exception as exc:
                  print(f'port {port}: DNS ERROR {type(exc).__name__}: {exc}',flush=True)
                  continue
              for ip in ips:
                  try:
                      with socket.create_connection((ip,port),timeout=8) as s:
                          print(f'{ip}:{port} TCP CONNECTED',flush=True)
                          s.settimeout(5)
                          try:
                              greeting=s.recv(512)
                              print(f'{ip}:{port} greeting={greeting[:160]!r}',flush=True)
                              if port==21:
                                  s.sendall(b'AUTH TLS\r\n')
                                  reply=s.recv(512)
                                  print(f'{ip}:21 AUTH TLS reply={reply[:160]!r}',flush=True)
                                  if reply.startswith(b'234'):
                                      ctx=ssl.create_default_context()
                                      with ctx.wrap_socket(s,server_hostname=host) as tls:
                                          print(f'FTPS TLS OK: {tls.version()}, {tls.cipher()}',flush=True)
                          except Exception as exc:
                              print(f'{ip}:{port} banner/TLS ERROR {type(exc).__name__}: {exc}',flush=True)
                  except Exception as exc:
                      print(f'{ip}:{port} TCP ERROR {type(exc).__name__}: {exc}',flush=True)
          PY
